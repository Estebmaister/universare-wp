name: Deploy theme to production

on:
  push:
    branches:
      - main
    paths:
      - 'wp-content/themes/universare-child/**'
      - 'wp-content/mu-plugins/**'
      - '.github/workflows/deploy-theme.yml'
  workflow_dispatch:

concurrency:
  group: deploy-theme-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate FTP secrets are set
        run: |
          test -n "${{ secrets.FTP_HOST }}" || { echo "FTP_HOST secret is empty"; exit 1; }
          test -n "${{ secrets.FTP_USER }}" || { echo "FTP_USER secret is empty"; exit 1; }
          test -n "${{ secrets.FTP_PASSWORD }}" || { echo "FTP_PASSWORD secret is empty"; exit 1; }
          echo "FTP secrets present (host user password)"

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy child theme via FTPS
        uses: SamKirkland/FTP-Deploy-Action@4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          local-dir: wp-content/themes/universare-child/
          server-dir: public_html/wp-content/themes/universare-child/
          dangerous-clean-slate: false
          log-level: verbose

      - name: Deploy mu-plugin via FTPS
        uses: SamKirkland/FTP-Deploy-Action@4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          local-dir: wp-content/mu-plugins/
          server-dir: public_html/wp-content/mu-plugins/
          dangerous-clean-slate: false
          log-level: minimal
