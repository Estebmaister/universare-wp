<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="needle-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6640"/>
      <stop offset="100%" stop-color="#b8956b"/>
    </linearGradient>
    <linearGradient id="needle-bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4c4a8"/>
      <stop offset="100%" stop-color="#ebe3d6"/>
    </linearGradient>
  </defs>
  <!-- Labyrinth rings -->
  <circle cx="160" cy="160" r="132" stroke="#c9b08a" stroke-width="1" opacity="0.3"/>
  <circle cx="160" cy="160" r="112" stroke="#c9b08a" stroke-width="1" opacity="0.4"/>
  <circle cx="160" cy="160" r="92" stroke="#c9b08a" stroke-width="1" opacity="0.5"/>
  <circle cx="160" cy="160" r="72" stroke="#c9b08a" stroke-width="1" opacity="0.6"/>
  <circle cx="160" cy="160" r="52" stroke="#c9b08a" stroke-width="1.1" opacity="0.7"/>
  <circle cx="160" cy="160" r="32" stroke="#c9b08a" stroke-width="1.2" opacity="0.85"/>
  <!-- Maze arcs between rings (r=122 and r=82 — no overlap with circle strokes) -->
  <path d="M160 38 A122 122 0 0 1 282 160" stroke="#c9b08a" stroke-width="1" opacity="0.45"/>
  <path d="M282 160 A122 122 0 0 1 160 282" stroke="#c9b08a" stroke-width="1" opacity="0.45"/>
  <path d="M160 282 A122 122 0 0 1 38 160" stroke="#c9b08a" stroke-width="1" opacity="0.45"/>
  <path d="M38 160 A122 122 0 0 1 160 38" stroke="#c9b08a" stroke-width="1" opacity="0.45"/>
  <path d="M160 78 A82 82 0 0 0 78 160" stroke="#c9b08a" stroke-width="1" opacity="0.5"/>
  <path d="M242 160 A82 82 0 0 0 160 242" stroke="#c9b08a" stroke-width="1" opacity="0.5"/>
  <!-- Compass face -->
  <circle cx="160" cy="160" r="22" stroke="#b8956b" stroke-width="1.2" opacity="0.9"/>
  <path d="M160 138v44M138 160h44" stroke="#c9b08a" stroke-width="0.8" opacity="0.35"/>
  <!-- Needle -->
  <path d="M160 122 L171 160 L160 151 L149 160 Z" fill="url(#needle-top)"/>
  <path d="M160 198 L149 160 L160 169 L171 160 Z" fill="url(#needle-bottom)"/>
  <circle cx="160" cy="160" r="5" fill="#8a6640"/>
  <circle cx="160" cy="160" r="2" fill="#faf6f0"/>
  <text x="160" y="94" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="600" fill="#9a7348" letter-spacing="1.5">N</text>
